<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remover Fundo 3x4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 24px;
    }

    .drop-zone {
      border: 2px dashed #4a90e2;
      border-radius: 8px;
      padding: 30px 20px;
      background-color: #f8fa0010;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      background-color: #eef5fc;
      border-color: #2b73c5;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: #4a90e2;
    }

    .drop-text {
      font-size: 0.95rem;
      color: #444;
    }

    .drop-text span {
      color: #4a90e2;
      font-weight: 600;
    }

    .file-list {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #555;
      max-height: 120px;
      overflow-y: auto;
      text-align: left;
      padding: 0 5px;
    }

    .btn-submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #357abd;
    }

    .btn-submit:disabled {
      background-color: #b0c4de;
      cursor: not-allowed;
    }

    .status {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .status.loading {
      color: #d97706;
    }

    .status.success {
      color: #16a34a;
    }

    .status.error {
      color: #dc2626;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Remover Fundo 3x4</h1>
    <p class="subtitle">Selecione uma ou mais fotos para remover o fundo automaticamente</p>

    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📷</div>
      <div class="drop-text">Arraste as fotos aqui ou <span>clique para navegar</span></div>
      <input type="file" id="fileInput" multiple accept="image/*" />
    </div>

    <div class="file-list" id="fileList"></div>

    <button class="btn-submit" id="btnSubmit" disabled>Processar Imagens</button>

    <div class="status" id="statusMessage"></div>
  </div>

  <script>
    const API_URL = "https://api-remocao-fundo.onrender.com/process-images";

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const btnSubmit = document.getElementById("btnSubmit");
    const statusMessage = document.getElementById("statusMessage");

    let selectedFiles = [];

    // Drag & Drop Handlers
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      updateFiles(files);
    });

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files);
      updateFiles(files);
    });

    function updateFiles(files) {
      selectedFiles = files;
      if (selectedFiles.length > 0) {
        fileList.innerHTML = `<strong>${selectedFiles.length} foto(s) selecionada(s):</strong><br>` + 
          selectedFiles.map(f => `• ${f.name}`).join('<br>');
        btnSubmit.disabled = false;
        statusMessage.textContent = "";
      } else {
        fileList.innerHTML = "";
        btnSubmit.disabled = true;
      }
    }

    btnSubmit.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span class="spinner"></span>Processando...`;
      statusMessage.className = "status loading";
      statusMessage.textContent = "Removendo fundo das fotos... Isso pode levar alguns segundos.";

      const formData = new FormData();
      selectedFiles.forEach(file => {
        formData.append("files", file);
      });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          throw new Error(`Erro na API: ${response.statusText}`);
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = downloadUrl;
        a.download = "fotos_3x4_sem_fundo.zip";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

        statusMessage.className = "status success";
        statusMessage.textContent = "✅ Download do arquivo .ZIP concluído!";
      } catch (error) {
        console.error(error);
        statusMessage.className = "status error";
        statusMessage.textContent = "❌ Falha ao processar as imagens. Verifique a API e tente novamente.";
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = "Processar Imagens";
      }
    });
  </script>
</body>
</html>
